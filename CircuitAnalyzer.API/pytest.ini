[pytest]
# Kökteki test_api.py / test_ac.py / test_solver.py canlı sunucuya istek atan
# eski entegrasyon betikleridir (import anında çalışır) — pytest'e dahil değil.
testpaths = tests
pythonpath = .
# 6 çekirdek: 16 çekirdekli makinede ölçülen en hızlı ayar (seri 28,5 sn → 22,3 sn).
# Her işçi lcapy'yi yeniden yükler; daha fazlası hızlandırmıyor. Tek test için: -n 0
addopts = -n 6
filterwarnings =
    ignore::DeprecationWarning
